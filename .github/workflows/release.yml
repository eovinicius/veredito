name: Release

# Publishes to nuget.org when a version tag is pushed: git tag v0.1.0 && git push origin v0.1.0
# Uses nuget.org Trusted Publishing (OIDC): no API key is stored. The policy on nuget.org must match
# owner "eovinicius", repository "veredito" and workflow file "release.yml".
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for the OIDC token exchange with nuget.org

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for SourceLink's commit metadata
          persist-credentials: false

      # 8.0.x provides the runtime for the net8.0 test run; 10.0.x is the SDK pinned by global.json.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet test -c Release

      # The tag is the version: v0.1.0 -> 0.1.0, v0.2.0-preview.1 -> 0.2.0-preview.1
      - run: dotnet pack src/Veredito -c Release -o artifacts -p:Version=${GITHUB_REF_NAME#v}

      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: eovinicius

      # Pushing the .nupkg also pushes the .snupkg next to it.
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
