name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for SourceLink's commit metadata
          persist-credentials: false

      # 8.0.x provides the runtime for the net8.0 test run; 10.0.x is the SDK pinned by global.json.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet restore

      - run: dotnet build -c Release --no-restore

      - run: dotnet test -c Release --no-build

      - run: dotnet pack src/Veredito -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error
